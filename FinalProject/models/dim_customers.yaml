version: 2

models:
  - name: dim_customer
    description: Conformed customer dimension across Fudgemart and Fudgeflix
    columns:
      - name: customer_sk
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: source_system
        tests: [not_null]
      - name: email
        tests: [not_null]
      - name: first_name
      - name: last_name
      - name: phone_number
      - name: address
      - name: city
      - name: state
      - name: zip_code
      - name: country
      - name: account_created_date
      - name: is_active