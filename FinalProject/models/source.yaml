version: 2

sources:
  - name: fudgemart
    database: raw
    schema: fudgemart_v3
    tables:
      - name: fm_customers
        columns:
          - name: customer_id
            tests: [not_null, unique]

      - name: fm_products
        columns:
          - name: product_id
            tests: [not_null, unique]

      - name: fm_orders
        columns:
          - name: order_id


      - name: fm_order_details
        columns:
          - name: order_id
          - name: product_id

  - name: fudgeflix
    database: raw
    schema: fudgeflix_v3
    tables:
      - name: ff_accounts
        columns:
          - name: account_id
            tests: [not_null, unique]

      - name: ff_titles
        columns:
          - name: title_id
            tests: [unique]

      - name: ff_account_billing
        columns:
          - name: ab_date

      - name: ff_account_titles
        columns:
          - name: at_queue_date
          - name: at_shipped_date
          - name: at_returned_date

      - name: ff_plans
        columns:
          - name: plan_id
            tests: [unique]
