version: 2

models:
  - name: dim_product
    description: Conformed product dimension combining physical and digital products
    columns:
      - name: product_sk
        tests: [not_null, unique]
      - name: product_id
        tests: [not_null, unique]
      - name: source_system
        tests: [not_null]
      - name: product_name
      - name: category
      - name: subcategory
      - name: vendor_id
      - name: unit_price
      - name: release_date
      - name: is_digital